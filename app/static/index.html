<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB Editor</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card">
    <img src="/favicon.ico" alt="" width="48" height="48">
    <h1>DB Editor</h1>
    <input id="login-password" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
    <button type="submit" class="primary">Entrar</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <header>
    <div class="brand"><img src="/favicon.ico" alt="" width="22" height="22"> DB Editor</div>
    <div id="crumbs" class="crumbs"></div>
    <div class="spacer"></div>
    <span id="ro-badge" class="badge warn hidden">Solo lectura</span>
    <button id="btn-refresh" title="Volver a buscar contenedores">⟳ Buscar</button>
    <button id="btn-logout">Salir</button>
  </header>
  <aside id="sidebar"><div class="muted pad">Cargando…</div></aside>
  <main id="main">
    <div class="empty">Elige una base de datos en el panel izquierdo.</div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
