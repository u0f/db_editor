name: db-editor

services:
  db-editor:
    build: .
    image: db-editor:latest
    container_name: db-editor
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      # Required: the UI can write to every database.
      # Read from the .env file next to this compose file (not committed); see .env.example.
      DB_EDITOR_PASSWORD: ${DB_EDITOR_PASSWORD:?Set DB_EDITOR_PASSWORD in the .env file}
      TZ: ${TZ:-UTC}
      # Optional (default values):
      # READ_ONLY: "false"              # true = nobody can write
      # ALLOW_SCHEMA_CHANGES: "false"   # true = allow DDL in the console (never with Alembic)
      # ENABLE_SQL_CONSOLE: "true"
      # BACKUP_KEEP: "5"                # backups kept per database
      # EXCLUDE_CONTAINERS: "container1,container2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host root: lets the viewer see ANY mount of any container
      # (your project bind mounts and named volumes) without listing them one by one.
      # Paths are translated automatically: /home/user/projects/x -> /host/home/user/projects/x.
      # Read/write because editing needs it; the Docker socket already grants
      # equivalent access, so it adds no real privileges.
      - /:/host:rslave
      # Backups (only written when you ask for one).
      - ./backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

x-casaos:
  architectures:
    - amd64
    - arm64
  main: db-editor
  author: u0f
  developer: u0f
  category: Developer
  title:
    en_us: DB Editor
    es_es: DB Editor
  tagline:
    en_us: Browse and edit the SQLite databases of your running containers
    es_es: Ver y editar las bases de datos SQLite de tus contenedores
  description:
    en_us: Discovers running Docker containers, finds their SQLite databases and lets you browse and edit them.
    es_es: Descubre los contenedores en marcha, encuentra sus bases de datos SQLite y permite verlas y editarlas.
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/sqlitebrowser.png
  index: /
  port_map: "8790"
  scheme: http
